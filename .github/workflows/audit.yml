name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      # Scope note: the previous `npm audit --omit=dev` covered production dependencies
      # only. bun audit has no prod-only switch, so this now also reports dev-dependency
      # advisories. That is a superset of the old check, not a narrower one.
      - name: Audit (all dependencies)
        run: bun audit
